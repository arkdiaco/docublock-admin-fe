server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; frame-src 'self' https://storage.googleapis.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location = /env.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location ~ "^/(?:[^/]+-[A-Z0-9]{8}\.(?:js|mjs|css)|media/.+)$" {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:js|mjs|css|map|ico|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|eot|xml)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "no-cache";
  }

  location ~* \.json$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; frame-src 'self' https://storage.googleapis.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  }
}
